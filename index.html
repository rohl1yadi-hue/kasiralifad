<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Kasir Thermal Bluetooth Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">

<div class="container mx-auto max-w-6xl">
    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 rounded-lg shadow-md mb-6 flex justify-between items-center">
        <h1 class="text-xl font-bold">POS Kasir Thermal Bluetooth</h1>
        <div>
            <button onclick="toggleSection('admin')" class="bg-white text-blue-600 px-3 py-1 rounded text-sm mr-2 font-semibold">⚙️ Kelola Produk</button>
            <button onclick="bukaRiwayat()" class="bg-white text-blue-600 px-3 py-1 rounded text-sm font-semibold">📜 Riwayat</button>
        </div>
    </header>

    <!-- Admin Section (Tambah & Hapus Produk) -->
    <div id="admin-section" class="bg-white p-4 rounded-lg shadow-md mb-6 hidden">
        <h2 class="text-lg font-bold mb-4">Manajemen Produk</h2>
        
        <!-- Form Tambah -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <input type="text" id="prod-name" placeholder="Nama Produk" class="border p-2 rounded">
            <input type="number" id="prod-price" placeholder="Harga (Angka Saja)" class="border p-2 rounded">
            <button onclick="tambahProduk()" class="bg-blue-600 text-white p-2 rounded hover:bg-blue-700 font-bold">Simpan Produk</button>
        </div>

        <hr class="mb-4">

        <!-- Daftar Produk untuk Dihapus -->
        <h3 class="text-md font-semibold mb-2">Daftar Produk Saat Ini:</h3>
        <div id="admin-product-list" class="divide-y max-h-40 overflow-y-auto border rounded p-2 bg-gray-50">
            <!-- List produk untuk manajemen muncul di sini -->
        </div>
    </div>

    <!-- Main Content -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- Daftar Menu -->
        <div class="md:col-span-2 bg-white p-4 rounded-lg shadow-md">
            <h2 class="text-lg font-bold mb-4">Daftar Menu</h2>
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-4" id="product-list"></div>
        </div>

        <!-- Keranjang -->
        <div class="bg-white p-4 rounded-lg shadow-md flex flex-col justify-between">
            <div>
                <h2 class="text-lg font-bold mb-2">Keranjang</h2>
                <div id="cart-list" class="divide-y mb-4 max-h-60 overflow-y-auto">
                    <p class="text-gray-400 text-sm">Keranjang kosong</p>
                </div>
            </div>
            
            <div class="border-t pt-2">
                <div class="font-bold text-lg mb-2 flex justify-between">
                    <span>Total:</span>
                    <span id="cart-total">Rp 0</span>
                </div>
                <input type="number" id="payment-amount" placeholder="Bayar (Rp)" class="w-full border p-2 mb-2 rounded" oninput="hitungKembalian()">
                <div id="change-amount" class="mb-4 font-semibold text-sm text-gray-600">Kembali: Rp 0</div>
                
                <button onclick="prosesTransaksi()" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700 shadow">
                    🖨️ Bayar & Cetak Langsung (RawBT)
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Modal Riwayat -->
<div id="modal-riwayat" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center p-4">
    <div class="bg-white rounded-lg max-w-lg w-full p-6 max-h-[80vh] flex flex-col">
        <h2 class="text-lg font-bold mb-4">Riwayat Transaksi</h2>
        <div id="history-list" class="overflow-y-auto flex-grow divide-y mb-4"></div>
        <div class="flex justify-between">
            <button onclick="hapusRiwayat()" class="bg-red-500 text-white px-4 py-2 rounded text-sm font-semibold hover:bg-red-600">Hapus Semua</button>
            <button onclick="tutupRiwayat()" class="bg-gray-300 text-gray-700 px-4 py-2 rounded text-sm font-semibold hover:bg-gray-400">Tutup</button>
        </div>
    </div>
</div>

<script>
    let products = JSON.parse(localStorage.getItem('myProducts')) || [
        { id: 1, name: "Kopi Hitam", price: 10000 },
        { id: 2, name: "Mie Goreng", price: 15000 }
    ];

    let cart = [];

    function tambahProduk() {
        const name = document.getElementById('prod-name').value;
        const price = parseInt(document.getElementById('prod-price').value);
        if(!name || !price) return alert("Isi nama dan harga produk dengan benar!");
        
        products.push({ id: Date.now(), name, price });
        localStorage.setItem('myProducts', JSON.stringify(products));
        renderProducts();
        document.getElementById('prod-name').value = '';
        document.getElementById('prod-price').value = '';
        alert("Produk berhasil ditambahkan!");
    }

    // Fungsi Hapus Produk
    function hapusProduk(id) {
        if(confirm("Yakin ingin menghapus produk ini?")) {
            products = products.filter(p => p.id !== id);
            localStorage.setItem('myProducts', JSON.stringify(products));
            renderProducts();
        }
    }

    function renderProducts() {
        const list = document.getElementById('product-list');
        const adminList = document.getElementById('admin-product-list');
        
        // Render menu kasir utama
        list.innerHTML = products.map(p => `
            <div onclick="addToCart(${p.id})" class="border p-3 rounded cursor-pointer hover:bg-blue-50 transition bg-white shadow-sm flex flex-col justify-between">
                <p class="font-bold text-gray-800">${p.name}</p>
                <p class="text-blue-600 text-sm font-semibold mt-1">Rp ${p.price.toLocaleString('id-ID')}</p>
            </div>
        `).join('');

        // Render daftar di menu kelola produk (admin)
        if(products.length === 0) {
            adminList.innerHTML = `<p class="text-gray-400 text-sm py-2 text-center">Belum ada produk.</p>`;
        } else {
            adminList.innerHTML = products.map(p => `
                py-2 flex justify-between items-center text-sm py-2
                <div class="flex justify-between items-center text-sm py-2">
                    <span><b>${p.name}</b> - Rp ${p.price.toLocaleString('id-ID')}</span>
                    <button onclick="hapusProduk(${p.id})" class="bg-red-500 text-white px-2.5 py-1 rounded text-xs font-bold hover:bg-red-600">Hapus</button>
                </div>
            `).join('');
        }
    }

    function toggleSection(id) {
        const section = document.getElementById(id + '-section');
        section.classList.toggle('hidden');
        if(!section.classList.contains('hidden')) {
            renderProducts(); // Refresh list admin saat dibuka
        }
    }

    function addToCart(id) {
        const prod = products.find(p => p.id === id);
        const item = cart.find(i => i.id === id);
        if(item) item.qty++;
        else cart.push({...prod, qty: 1});
        renderCart();
    }

    function renderCart() {
        const list = document.getElementById('cart-list');
        if(cart.length === 0) {
            list.innerHTML = `<p class="text-gray-400 text-sm">Keranjang kosong</p>`;
            document.getElementById('cart-total').innerText = 'Rp 0';
            document.getElementById('change-amount').innerText = 'Kembali: Rp 0';
            return;
        }

        let total = 0;
        list.innerHTML = cart.map(i => {
            let subtotal = i.price * i.qty;
            total += subtotal;
            return `
                <div class="flex justify-between items-center text-sm py-2">
                    <div>
                        <p class="font-semibold">${i.name}</p>
                        <p class="text-xs text-gray-500">Rp ${i.price.toLocaleString('id-ID')} x ${i.qty}</p>
                    </div>
                    <span class="font-bold">Rp ${subtotal.toLocaleString('id-ID')}</span>
                </div>
            `;
        }).join('');
        document.getElementById('cart-total').innerText = 'Rp ' + total.toLocaleString('id-ID');
        hitungKembalian();
    }

    function hitungKembalian() {
        const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
        const bayar = parseInt(document.getElementById('payment-amount').value) || 0;
        const kembalian = bayar - total;
        
        const el = document.getElementById('change-amount');
        if(kembalian >= 0) {
            el.innerText = 'Kembali: Rp ' + kembalian.toLocaleString('id-ID');
            el.className = "mb-4 font-semibold text-sm text-green-600";
        } else {
            el.innerText = 'Kurang: Rp ' + Math.abs(kembalian).toLocaleString('id-ID');
            el.className = "mb-4 font-semibold text-sm text-red-600";
        }
    }

    function prosesTransaksi() {
        if(cart.length === 0) return alert("Keranjang masih kosong!");
        
        const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
        const bayar = parseInt(document.getElementById('payment-amount').value) || 0;

        if(bayar < total) return alert("Uang pembayaran kurang!");

        const kembalian = bayar - total;
        const trxId = 'TRX-' + Date.now();
        const tanggal = new Date().toLocaleString('id-ID');

        const transaksiBaru = { id: trxId, date: tanggal, total, payment: bayar, change: kembalian, items: [...cart] };

        let history = JSON.parse(localStorage.getItem('transactions')) || [];
        history.unshift(transaksiBaru);
        localStorage.setItem('transactions', JSON.stringify(history));

        kirimKePrinterRawBT(transaksiBaru);

        cart = [];
        document.getElementById('payment-amount').value = '';
        renderCart();
    }

    function kirimKePrinterRawBT(trx) {
        let struk = "     TOKO KASIR KITA     \n";
        struk += "================================\n";
        struk += `ID : ${trx.id}\n`;
        struk += `Tgl: ${trx.date}\n`;
        struk += "--------------------------------\n";
        
        trx.items.forEach(i => {
            let subtotal = i.price * i.qty;
            let namaItem = i.name.substring(0, 16);
            let infoQty = `${i.qty}x @${i.price}`;
            struk += `${namaItem}\n`;
            struk += `  ${infoQty.padEnd(16)} Rp ${subtotal.toLocaleString('id-ID')}\n`;
        });

        struk += "--------------------------------\n";
        struk += `Total  : Rp ${trx.total.toLocaleString('id-ID')}\n`;
        struk += `Bayar  : Rp ${trx.payment.toLocaleString('id-ID')}\n`;
        struk += `Kembali: Rp ${trx.change.toLocaleString('id-ID')}\n`;
        struk += "================================\n";
        struk += "   Terima Kasih Atas Belanjanya \n\n\n";

        let base64Struk = btoa(unescape(encodeURIComponent(struk)));
        window.location.href = "rawbt:base64," + base64Struk;
    }

    function bukaRiwayat() {
        const history = JSON.parse(localStorage.getItem('transactions')) || [];
        const list = document.getElementById('history-list');
        
        if(history.length === 0) {
            list.innerHTML = `<p class="text-gray-500 text-center py-4 text-sm">Belum ada riwayat transaksi.</p>`;
        } else {
            list.innerHTML = history.map((h, index) => {
                let detailItem = h.items.map(i => `${i.name} (${i.qty}x)`).join(', ');
                return `
                    <div class="py-3 text-sm flex justify-between items-center border-b">
                        <div>
                            <div class="font-bold text-gray-800">${h.id} - <span class="text-blue-600">Rp ${h.total.toLocaleString('id-ID')}</span></div>
                            <p class="text-xs text-gray-500">${h.date}</p>
                            <p class="text-xs text-gray-600 mt-0.5">Item: ${detailItem}</p>
                        </div>
                        <button onclick="cetakUlang(${index})" class="bg-blue-500 text-white px-3 py-1.5 rounded text-xs font-bold hover:bg-blue-600 shrink-0 ml-2">
                            🖨️ Cetak Ulang
                        </button>
                    </div>
                `;
            }).join('');
        }
        document.getElementById('modal-riwayat').classList.remove('hidden');
    }

    function cetakUlang(index) {
        const history = JSON.parse(localStorage.getItem('transactions')) || [];
        const trx = history[index];
        if (trx) kirimKePrinterRawBT(trx);
    }

    function tutupRiwayat() {
        document.getElementById('modal-riwayat').classList.add('hidden');
    }

    function hapusRiwayat() {
        if(confirm("Yakin ingin menghapus seluruh riwayat transaksi?")) {
            localStorage.removeItem('transactions');
            bukaRiwayat();
        }
    }

    renderProducts();
</script>
</body>
</html>
