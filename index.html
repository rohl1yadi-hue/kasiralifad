<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Kasir Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="bg-gray-100 p-4">

<div class="container mx-auto max-w-6xl">
    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 rounded-lg shadow-md mb-6 flex justify-between items-center">
        <h1 class="text-xl font-bold">POS Kasir & Manajemen Produk</h1>
        <div>
            <button onclick="toggleSection('admin')" class="bg-white text-blue-600 px-3 py-1 rounded text-sm mr-2">⚙️ Kelola Produk</button>
            <button onclick="bukaRiwayat()" class="bg-white text-blue-600 px-3 py-1 rounded text-sm">📜 Riwayat</button>
        </div>
    </header>

    <!-- Admin Section (Hidden by Default) -->
    <div id="admin-section" class="bg-white p-4 rounded-lg shadow-md mb-6 hidden">
        <h2 class="text-lg font-bold mb-4">Tambah Produk Baru</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <input type="text" id="prod-name" placeholder="Nama Produk" class="border p-2 rounded">
            <input type="number" id="prod-price" placeholder="Harga" class="border p-2 rounded">
            <button onclick="tambahProduk()" class="bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Simpan Produk</button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="md:col-span-2 bg-white p-4 rounded-lg shadow-md">
            <h2 class="text-lg font-bold mb-4">Daftar Menu</h2>
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-4" id="product-list"></div>
        </div>

        <div class="bg-white p-4 rounded-lg shadow-md">
            <h2 class="text-lg font-bold mb-2">Keranjang</h2>
            <div id="cart-list" class="divide-y mb-4"></div>
            <div class="border-t pt-2 font-bold text-lg">Total: <span id="cart-total">Rp 0</span></div>
            <input type="number" id="payment-amount" placeholder="Bayar (Rp)" class="w-full border p-2 my-3 rounded" oninput="hitungKembalian()">
            <div id="change-amount" class="mb-4 font-semibold">Kembali: Rp 0</div>
            <button onclick="prosesTransaksi()" class="w-full bg-green-600 text-white py-2 rounded font-bold hover:bg-green-700">Bayar & Print</button>
        </div>
    </div>
</div>

<!-- Modal & Print Area sama seperti sebelumnya -->
<div id="modal-riwayat" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center p-4">
    <div class="bg-white rounded-lg max-w-lg w-full p-6 max-h-[80vh] overflow-y-auto" id="history-list"></div>
</div>

<div id="print-area" class="hidden p-4 max-w-[300px] mx-auto text-sm font-mono">
    <h3 class="font-bold text-center">TOKO KASIR KU</h3>
    <div id="receipt-items"></div>
    <div class="border-t mt-2 pt-2">Total: <span id="receipt-total"></span></div>
</div>

<script>
    // 1. Manajamen Data Produk
    let products = JSON.parse(localStorage.getItem('myProducts')) || [
        { id: 1, name: "Kopi Hitam", price: 10000 },
        { id: 2, name: "Mie Goreng", price: 15000 }
    ];

    function tambahProduk() {
        const name = document.getElementById('prod-name').value;
        const price = parseInt(document.getElementById('prod-price').value);
        if(!name || !price) return alert("Isi data produk!");
        
        products.push({ id: Date.now(), name, price });
        localStorage.setItem('myProducts', JSON.stringify(products));
        renderProducts();
        document.getElementById('prod-name').value = '';
        document.getElementById('prod-price').value = '';
    }

    function renderProducts() {
        const list = document.getElementById('product-list');
        list.innerHTML = products.map(p => `
            <div onclick="addToCart(${p.id})" class="border p-3 rounded cursor-pointer hover:bg-blue-50">
                <p class="font-bold">${p.name}</p>
                <p class="text-blue-600 text-sm">Rp ${p.price.toLocaleString()}</p>
            </div>
        `).join('');
    }

    function toggleSection(id) {
        document.getElementById(id + '-section').classList.toggle('hidden');
    }

    // 2. Fungsi Kasir (Keranjang, Hitung, Print, History)
    let cart = [];
    function addToCart(id) {
        const prod = products.find(p => p.id === id);
        const item = cart.find(i => i.id === id);
        if(item) item.qty++;
        else cart.push({...prod, qty: 1});
        renderCart();
    }

    function renderCart() {
        const list = document.getElementById('cart-list');
        let total = 0;
        list.innerHTML = cart.map(i => {
            total += i.price * i.qty;
            return `<div class="py-2">${i.name} x${i.qty} = Rp ${(i.price * i.qty).toLocaleString()}</div>`;
        }).join('');
        document.getElementById('cart-total').innerText = 'Rp ' + total.toLocaleString();
    }

    function prosesTransaksi() {
        const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
        const bayar = parseInt(document.getElementById('payment-amount').value);
        if(bayar < total) return alert("Uang Kurang!");

        // Simpan History
        let history = JSON.parse(localStorage.getItem('transactions')) || [];
        history.push({ date: new Date().toLocaleDateString(), total, items: cart });
        localStorage.setItem('transactions', JSON.stringify(history));

        // Print
        document.getElementById('receipt-items').innerHTML = cart.map(i => `<div>${i.name} (${i.qty})</div>`).join('');
        document.getElementById('receipt-total').innerText = total;
        window.print();
        
        cart = [];
        renderCart();
    }

    function bukaRiwayat() {
        const history = JSON.parse(localStorage.getItem('transactions')) || [];
        document.getElementById('history-list').innerHTML = history.map(h => 
            `<div class="border-b py-2 text-sm"><b>${h.date}</b> - Total: Rp ${h.total.toLocaleString()}</div>`
        ).join('');
        document.getElementById('modal-riwayat').classList.remove('hidden');
    }
    
    // Inisialisasi
    renderProducts();
</script>
</body>
</html>
